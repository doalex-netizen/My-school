:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fdf8f3;--card:#fff;--tx:#4a4458;--mut:#8a8498;--c7:#cfe8e0;--c8:#f8dcd2;--c9:#dcd6f0;--c4:#fbeec3;--ac:#8f7fc4;--bd:#eadfd6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#262330;--card:#322e3f;--tx:#ece8f5;--mut:#aaa3bd;--c7:#2f4a45;--c8:#54393a;--c9:#413b5e;--c4:#554b2c;--ac:#b7a9ee;--bd:#443f55}}
:root[data-theme="dark"]{--bg:#262330;--card:#322e3f;--tx:#ece8f5;--mut:#aaa3bd;--c7:#2f4a45;--c8:#54393a;--c9:#413b5e;--c4:#554b2c;--ac:#b7a9ee;--bd:#443f55}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Georgia,"Times New Roman",serif;line-height:1.55}
.w{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
header{text-align:center;padding:36px 8px 20px}
.logo{font-size:2.3rem;margin:0;letter-spacing:1px}
.logo span{color:var(--ac)}
.sub{color:var(--mut);margin:4px 0 22px}
.quote{min-height:3.2em;font-size:1.3rem;font-style:italic;transition:opacity .5s;max-width:640px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:26px}
.big{border:0;border-radius:24px;padding:28px 18px;cursor:pointer;color:var(--tx);font:inherit;text-align:center;box-shadow:0 4px 14px rgba(120,100,140,.12);transition:transform .2s}
.big:hover{transform:translateY(-4px)}
.big.on{outline:3px solid var(--ac)}
.big b{display:block;font-size:1.5rem}
.big small{color:var(--mut)}
.big i{font-size:2.2rem;font-style:normal;display:block;margin-bottom:6px}
.sec{margin-top:22px;background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:20px;display:none}
.sec.show{display:block;animation:f .4s}
@keyframes f{from{opacity:0;transform:translateY(8px)}}
.sec h2{margin:0 0 12px;font-size:1.3rem}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:999px;padding:9px 18px;font:inherit;cursor:pointer}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.panel{margin-top:16px}
details{border:1px solid var(--bd);border-radius:14px;padding:11px 16px;margin-bottom:10px;background:var(--bg)}
summary{cursor:pointer;font-weight:bold}
details p{margin:8px 0 2px}
.hint{color:var(--mut);font-size:.9rem;margin-top:14px}
footer{text-align:center;color:var(--mut);margin-top:36px;font-size:.9rem}
</style></head><body><div class="w">

<div class="quote" id="q"></div>
</header>

<footer>Каждый день понемногу — и ты уже на вершине 🌿</footer>
